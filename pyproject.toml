[project]
name = "entirius-django-checkout-export-to-magento-api"
version = "2.0.0"
description = "Export of Volkanos checkout orders, payments and shipments to the Magento 2 API"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "entirius-django-checkout>=9.0.0",
    "entirius-py-magento2-sdk>=2.0.0",
    "entirius-py-bievents>=2.0.0",
    "entirius-py-idx-normalizator>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "dj-database-url", "psycopg[binary]"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-checkout-export-to-magento-api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_checkout_export_to_magento_api"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S108"]
# Legacy migrated 1:1
"src/django_checkout_export_to_magento_api/models.py" = ["DJ001", "DJ008"]
"src/django_checkout_export_to_magento_api/tasks/*.py" = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["django_checkout_export_to_magento_api"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
